    <!-- =====================================================
         S-21 개별
         ===================================================== -->

      <div class="section-title mb-3">

          type="button"
          class="btn btn-success w-100 fw-bold py-2"

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbz_Qn5OrZ39cY4NMkIcsvQQTXrFgjrJ-a9ov3PThyp5oMxfuBoQnR4WkpLHl6cIGRsp/exec";


let secretaryPubId = "";
let secretaryPin = "";


/* =========================================================
   API
   ========================================================= */

async function apiCall(action, payload = {}) {

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({
              action: action,
              payload: payload
            })
        }
      );


    if (!response.ok) {

      return {
        success: false,
        message:
          `서버 응답 오류: HTTP ${response.status}`
      };
    }


    return await response.json();

  } catch (e) {

    console.error(
      "API 통신 오류:",
      e
    );


    return {
      success: false,
      message:
        "서버 통신에 실패했습니다."
    };
  }
}


/* =========================================================
   로그인
   ========================================================= */

async function loginSecretary() {

  const identifier =
    document
      .getElementById(
        "secretaryIdentifier"
      )
      .value
      .trim();


  const pin =
    document
      .getElementById(
        "secretaryPin"
      )
      .value
      .trim();


  if (!identifier || !pin) {

    alert(
      "성명 또는 ID와 비밀번호(PIN)를 입력하세요."
    );

    return;
  }


  const button =
    document.getElementById(
      "btnSecretaryLogin"
    );


  button.disabled = true;
  button.innerText = "확인 중...";


  const res =
    await apiCall(
      "verifySecretaryLogin",
      {
        identifier: identifier,
        enteredPin: pin
      }
    );


  button.disabled = false;
  button.innerText = "접속하기";


  if (!res || !res.success) {

    alert(
      res
        ? res.message
        : "로그인에 실패했습니다."
    );

    return;
  }


  secretaryPubId =
    res.pubId;


  secretaryPin =
    pin;


  document.getElementById(
    "loggedSecretaryName"
  ).innerText =
    res.displayName ||
    res.nameKo ||
    res.nameRu ||
    res.pubId;


  document.getElementById(
    "loginScreen"
  ).style.display =
    "none";


  document.getElementById(
    "mainScreen"
  ).style.display =
    "block";


  await initializeSecretaryPortal();
}


function logoutSecretary() {

  secretaryPubId = "";
  secretaryPin = "";

  location.reload();
}


/* =========================================================
   초기화
   ========================================================= */

async function initializeSecretaryPortal() {

  populateYears();

  setCurrentMonth();

  await populatePublishers();

  updateS21Previews();

  updateS88Preview();
}


/* =========================================================
   봉사연도
   ========================================================= */

function getCurrentServiceYear() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    now.getMonth() + 1;


  return month >= 9
    ? year + 1
    : year;
}


function populateYears() {

  const currentSY =
    getCurrentServiceYear();


  const single =
    document.getElementById(
      "singleYear"
    );


  const batch =
    document.getElementById(
      "batchYear"
    );


  const s88 =
    document.getElementById(
      "s88ServiceYear"
    );


  single.innerHTML = "";
  batch.innerHTML = "";
  s88.innerHTML = "";


  const startYear =
    Math.max(
      2026,
      currentSY - 1
    );


  const endYear =
    currentSY + 1;


  for (
    let sy = startYear;
    sy <= endYear;
    sy++
  ) {

    [
      single,
      batch,
      s88
    ].forEach(select => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        String(sy);


      option.text =
        `${sy} 봉사연도`;


      if (sy === currentSY) {
        option.selected = true;
      }


      select.appendChild(
        option
      );
    });
  }


  single.addEventListener(
    "change",
    updateS21Previews
  );


  batch.addEventListener(
    "change",
    updateS21Previews
  );


  document
    .getElementById(
      "singleYearRange"
    )
    .addEventListener(
      "change",
      updateS21Previews
    );


  document
    .getElementById(
      "batchYearRange"
    )
    .addEventListener(
      "change",
      updateS21Previews
    );
}


/* =========================================================
   현재 월
   ========================================================= */

function setCurrentMonth() {

  const now =
    new Date();


  const yearMonth =
    `${now.getFullYear()}-` +
    `${String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    )}`;


  document.getElementById(
    "s88Month"
  ).value =
    yearMonth;
}


/* =========================================================
   선택 결과 안내
   ========================================================= */

function getYearRangeText(
  serviceYear,
  yearRange
) {

  const year =
    Number(serviceYear);


  if (
    yearRange ===
    "CURRENT_AND_PREV"
  ) {

    return (
      `${year - 1}_KO + ` +
      `${year}_KO`
    );
  }


  return `${year}_KO`;
}


function updateS21Previews() {

  const singleYear =
    Number(
      document.getElementById(
        "singleYear"
      ).value
    );


  const singleRange =
    document.getElementById(
      "singleYearRange"
    ).value;


  const batchYear =
    Number(
      document.getElementById(
        "batchYear"
      ).value
    );


  const batchRange =
    document.getElementById(
      "batchYearRange"
    ).value;


  document.getElementById(
    "singleYearPreview"
  ).innerText =
    singleYear
      ? `대상 시트: ${getYearRangeText(
          singleYear,
          singleRange
        )}`
      : "";


  document.getElementById(
    "batchYearPreview"
  ).innerText =
    batchYear
      ? `각 전도인 대상 시트: ${getYearRangeText(
          batchYear,
          batchRange
        )}`
      : "";
}


function updateS88Preview() {

  const year =
    Number(
      document.getElementById(
        "s88ServiceYear"
      ).value
    );


  const preview =
    document.getElementById(
      "s88SheetPreview"
    );


  if (!year) {

    preview.innerText = "-";

    return;
  }


  preview.innerText =
    `${year - 1}-${year} 시트`;
}


/* =========================================================
   전도인 목록
   ========================================================= */

async function populatePublishers() {

  const list =
    await apiCall(
      "getActivePublishers"
    );


  const select =
    document.getElementById(
      "singlePublisher"
    );


  select.innerHTML =
    `<option value="">전도인을 선택하세요</option>`;


  if (!Array.isArray(list)) {

    console.error(
      "전도인 목록 조회 실패:",
      list
    );

    return;
  }


  list
    .slice()
    .sort(
      (a, b) =>

        String(
          a.nameKo ||
          a.nameRu ||
          a.nameEn ||
          ""
        ).localeCompare(

          String(
            b.nameKo ||
            b.nameRu ||
            b.nameEn ||
            ""
          ),

          "ko"
        )
    )
    .forEach(p => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        p.id;


      const displayName =
        p.nameKo ||
        p.nameRu ||
        p.nameEn ||
        p.id;


      option.text =
        `${displayName} (${p.group || "미배정"})`;


      select.appendChild(
        option
      );
    });
}


/* =========================================================
   다운로드 도우미
   ========================================================= */

function openDownloadWindow() {

  return window.open(
    "about:blank",
    "_blank"
  );
}


function completeDownload(
  popup,
  url
) {

  if (popup) {

    popup.location.href =
      url;

  } else {

    window.location.href =
      url;
  }
}


function closeDownloadWindow(
  popup
) {

  if (
    popup &&
    !popup.closed
  ) {

    popup.close();
  }
}


function showWarnings(res) {

  if (
    !res ||
    !Array.isArray(
      res.warnings
    ) ||
    res.warnings.length === 0
  ) {
    return;
  }


  const text =
    res.warnings
      .slice(
        0,
        15
      )
      .join(
        "\n"
      );


  setTimeout(
    () => {

      alert(
        "다운로드는 생성되었지만 다음 항목을 확인해 주세요.\n\n" +
        text
      );

    },
    300
  );
}


/* =========================================================
   S-21 개별
   ========================================================= */

async function downloadSingleS21() {

  const pubId =
    document.getElementById(
      "singlePublisher"
    ).value;


  const serviceYear =
    Number(
      document.getElementById(
        "singleYear"
      ).value
    );


  const yearRange =
    document.getElementById(
      "singleYearRange"
    ).value;


  if (!pubId) {

    alert(
      "전도인을 선택하세요."
    );

    return;
  }


  if (!serviceYear) {

    alert(
      "봉사연도를 선택하세요."
    );

    return;
  }


  const popup =
    openDownloadWindow();


  const button =
    document.getElementById(
      "btnSingleS21"
    );


  button.disabled = true;
  button.innerText =
    "⏳ S-21 생성 중...";


  const res =
    await apiCall(
      "exportS21Cards",
      {
        serviceYear:
          serviceYear,

        yearRange:
          yearRange,

        roleFilter:
          "ALL",

        publisherId:
          pubId,

        secretaryPubId:
          secretaryPubId,

        secretaryPin:
          secretaryPin
      }
    );


  button.disabled = false;
  button.innerText =
    "📥 개별 S-21 다운로드";


  if (
    res &&
    res.success &&
    res.downloadUrl
  ) {

    completeDownload(
      popup,
      res.downloadUrl
    );


    showWarnings(
      res
    );


    return;
  }


  closeDownloadWindow(
    popup
  );


  alert(
    res
      ? res.message
      : "S-21 생성에 실패했습니다."
  );
}


/* =========================================================
   S-21 일괄
   ========================================================= */

async function downloadBatchS21() {

  const serviceYear =
    Number(
      document.getElementById(
        "batchYear"
      ).value
    );


  const yearRange =
    document.getElementById(
      "batchYearRange"
    ).value;


  const roleFilter =
    document.getElementById(
      "batchRole"
    ).value;


  if (!serviceYear) {

    alert(
      "봉사연도를 선택하세요."
    );

    return;
  }


  const popup =
    openDownloadWindow();


  const button =
    document.getElementById(
      "btnBatchS21"
    );


  button.disabled = true;
  button.innerText =
    "⏳ S-21 생성 및 압축 중...";


  const res =
    await apiCall(
      "exportS21Cards",
      {
        serviceYear:
          serviceYear,

        yearRange:
          yearRange,

        roleFilter:
          roleFilter,

        publisherId:
          "",

        secretaryPubId:
          secretaryPubId,

        secretaryPin:
          secretaryPin
      }
    );


  button.disabled = false;
  button.innerText =
    "📥 S-21 일괄 다운로드";


  if (
    res &&
    res.success &&
    res.downloadUrl
  ) {

    completeDownload(
      popup,
      res.downloadUrl
    );


    showWarnings(
      res
    );


    return;
  }


  closeDownloadWindow(
    popup
  );


  alert(
    res
      ? res.message
      : "S-21 생성에 실패했습니다."
  );
}


/* =========================================================
   S-88 동기화
   ========================================================= */

async function syncS88() {

  const month =
    document.getElementById(
      "s88Month"
    ).value;


  if (!month) {

    alert(
      "동기화할 월을 선택하세요."
    );

    return;
  }


  const button =
    document.getElementById(
      "btnSyncS88"
    );


  button.disabled = true;
  button.innerText =
    "동기화 중...";


  const res =
    await apiCall(
      "secretarySyncS88",
      {
        yearMonth:
          month,

        secretaryPubId:
          secretaryPubId,

        secretaryPin:
          secretaryPin
      }
    );


  button.disabled = false;
  button.innerText =
    "🔄 해당 월 S-88 동기화";


  alert(
    res
      ? res.message
      : "S-88 동기화에 실패했습니다."
  );
}


/* =========================================================
   S-88 다운로드
   ========================================================= */

async function downloadS88() {

  const serviceYear =
    Number(
      document.getElementById(
        "s88ServiceYear"
      ).value
    );


  if (!serviceYear) {

    alert(
      "다운로드할 봉사연도를 선택하세요."
    );

    return;
  }


  const popup =
    openDownloadWindow();


  const button =
    document.getElementById(
      "btnDownloadS88"
    );


  button.disabled = true;
  button.innerText =
    "⏳ S-88 파일 생성 중...";


  const res =
    await apiCall(
      "downloadS88Sheet",
      {
        serviceYear:
          serviceYear,

        secretaryPubId:
          secretaryPubId,

        secretaryPin:
          secretaryPin
      }
    );


  button.disabled = false;
  button.innerText =
    "📥 S-88 엑셀 다운로드";


  if (
    res &&
    res.success &&
    res.downloadUrl
  ) {

    completeDownload(
      popup,
      res.downloadUrl
    );

    return;
  }


  closeDownloadWindow(
    popup
  );


  alert(
    res
      ? res.message
      : "S-88 다운로드 생성에 실패했습니다."
  );
}


/* =========================================================
   Enter 키 로그인
   ========================================================= */

document
  .getElementById(
    "secretaryPin"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        loginSecretary();
      }
    }
  );

</script>
