<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>인천 러시아어 서기 업무 포털</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="ИР Secretary"
  >

  <link rel="icon" type="image/png" href="icon-p.png">
  <link rel="apple-touch-icon" href="icon-p.png">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #eef2f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    .card {
      border-radius: 14px;
      border: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #2c3e50;
      border-left: 5px solid #0d6efd;
      padding-left: 10px;
    }
  </style>
</head>


<body class="py-3">

<div
  class="container"
  style="max-width:720px;"
>


  <!-- =====================================================
       로그인
       ===================================================== -->
  <div
    id="loginScreen"
    class="card p-4 mx-auto mt-4 text-center"
    style="max-width:420px;"
  >

    <h4 class="fw-bold mb-2">
      서기 업무 관리
    </h4>

    <div class="text-primary fw-bold mb-3">
      인천 러시아어 회중
    </div>

    <div
      class="alert alert-light border small text-secondary"
    >
      장로의 회 조정자 및 서기가 접속할 수 있습니다.
    </div>


    <label
      class="form-label fw-bold text-start d-block"
    >
      성명 또는 ID
    </label>

    <input
      type="text"
      id="secretaryIdentifier"
      class="form-control form-control-lg text-center mb-3"
      placeholder="성명 또는 ID"
      autocomplete="username"
    >


    <label
      class="form-label fw-bold text-start d-block"
    >
      비밀번호(PIN)
    </label>

    <input
      type="password"
      id="secretaryPin"
      class="form-control form-control-lg text-center mb-3"
      maxlength="6"
      placeholder="••••"
      autocomplete="current-password"
    >


    <button
      class="btn btn-primary btn-lg w-100 fw-bold"
      id="btnSecretaryLogin"
      onclick="loginSecretary()"
    >
      접속하기
    </button>

  </div>


  <!-- =====================================================
       메인
       ===================================================== -->
  <div
    id="mainScreen"
    style="display:none;"
  >

    <div
      class="d-flex justify-content-between align-items-center bg-white p-3 rounded shadow-sm mb-3"
    >

      <div>

        <div class="small text-muted">
          서기 업무 관리
        </div>

        <div
          class="fw-bold text-primary fs-5"
          id="loggedSecretaryName"
        >
          관리자
        </div>

      </div>


      <button
        class="btn btn-sm btn-outline-danger"
        onclick="logoutSecretary()"
      >
        로그아웃
      </button>

    </div>


    <div
      class="alert alert-warning small shadow-sm"
    >
      이 페이지는 S-21 및 S-88 문서 관리 전용입니다.
      장로의 회 조정자 및 서기만 이용할 수 있습니다.
    </div>


    <!-- =====================================================
         S-21 개별
         ===================================================== -->
    <div class="card p-3 mb-3">

      <div
        class="section-title mb-3"
      >
        📄 S-21 개별 다운로드
      </div>


      <div class="row g-2">

        <div class="col-md-7">

          <label
            class="form-label small fw-bold text-secondary"
          >
            전도인
          </label>

          <select
            id="singlePublisher"
            class="form-select fw-bold"
          >
            <option value="">
              전도인을 선택하세요
            </option>
          </select>

        </div>


        <div class="col-md-5">

          <label
            class="form-label small fw-bold text-secondary"
          >
            봉사연도
          </label>

          <select
            id="singleYear"
            class="form-select fw-bold"
          ></select>

        </div>

      </div>


      <button
        class="btn btn-primary w-100 fw-bold mt-3 py-2"
        id="btnSingleS21"
        onclick="downloadSingleS21()"
      >
        📥 개별 S-21 다운로드
      </button>

    </div>


    <!-- =====================================================
         S-21 일괄
         ===================================================== -->
    <div class="card p-3 mb-3">

      <div
        class="section-title mb-3"
      >
        📦 S-21 일괄 다운로드
      </div>


      <div class="row g-2">

        <div class="col-md-6">

          <label
            class="form-label small fw-bold text-secondary"
          >
            봉사연도
          </label>

          <select
            id="batchYear"
            class="form-select fw-bold"
          ></select>

        </div>


        <div class="col-md-6">

          <label
            class="form-label small fw-bold text-secondary"
          >
            대상
          </label>

          <select
            id="batchRole"
            class="form-select fw-bold"
          >

            <option
              value="ALL"
              selected
            >
              전체
            </option>

            <option value="PIONEER_ONLY">
              정규 파이오니아
            </option>

            <option value="PUBLISHER_ONLY">
              일반 전도인
            </option>

          </select>

        </div>

      </div>


      <button
        class="btn btn-danger w-100 fw-bold mt-3 py-2"
        id="btnBatchS21"
        onclick="downloadBatchS21()"
      >
        📥 S-21 일괄 다운로드 (ZIP)
      </button>

    </div>


    <!-- =====================================================
         S-88
         ===================================================== -->
    <div class="card p-3 mb-3">

      <div
        class="section-title mb-3"
      >
        📊 S-88 회중 집회 참석 기록
      </div>


      <label
        class="form-label small fw-bold text-secondary"
      >
        동기화 대상 월
      </label>

      <input
        type="month"
        id="s88Month"
        class="form-control fw-bold mb-3"
      >


      <div class="row g-2">

        <div class="col-md-6">

          <button
            class="btn btn-outline-primary w-100 fw-bold py-2"
            id="btnSyncS88"
            onclick="syncS88()"
          >
            🔄 해당 월 S-88 동기화
          </button>

        </div>


        <div class="col-md-6">

          <button
            class="btn btn-success w-100 fw-bold py-2"
            id="btnDownloadS88"
            onclick="downloadS88()"
          >
            📥 S-88 엑셀 다운로드
          </button>

        </div>

      </div>

    </div>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbz_Qn5OrZ39cY4NMkIcsvQQTXrFgjrJ-a9ov3PThyp5oMxfuBoQnR4WkpLHl6cIGRsp/exec";


let secretaryPubId = "";
let secretaryPin = "";


/* =========================================================
   API
   ========================================================= */

async function apiCall(
  action,
  payload = {}
) {

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({
              action: action,
              payload: payload
            })
        }
      );


    return await response.json();

  } catch (e) {

    console.error(
      "API 통신 오류:",
      e
    );


    return {
      success: false,
      message:
        "서버 통신에 실패했습니다."
    };
  }
}


/* =========================================================
   로그인
   ========================================================= */

async function loginSecretary() {

  const identifier =
    document
      .getElementById(
        "secretaryIdentifier"
      )
      .value
      .trim();


  const pin =
    document
      .getElementById(
        "secretaryPin"
      )
      .value
      .trim();


  if (!identifier || !pin) {

    alert(
      "성명과 비밀번호(PIN)를 입력하세요."
    );

    return;
  }


  const btn =
    document.getElementById(
      "btnSecretaryLogin"
    );


  btn.disabled = true;
  btn.innerText = "확인 중...";


  const res =
    await apiCall(
      "verifySecretaryLogin",
      {
        identifier: identifier,
        enteredPin: pin
      }
    );


  btn.disabled = false;
  btn.innerText = "접속하기";


  if (
    !res ||
    !res.success
  ) {

    alert(
      res
        ? res.message
        : "로그인에 실패했습니다."
    );

    return;
  }


  secretaryPubId =
    res.pubId;

  secretaryPin =
    pin;


  document.getElementById(
    "loggedSecretaryName"
  ).innerText =
    res.displayName;


  document.getElementById(
    "loginScreen"
  ).style.display =
    "none";


  document.getElementById(
    "mainScreen"
  ).style.display =
    "block";


  await initializeSecretaryPortal();
}


function logoutSecretary() {

  secretaryPubId = "";
  secretaryPin = "";

  location.reload();
}


/* =========================================================
   초기화
   ========================================================= */

async function initializeSecretaryPortal() {

  populateYears();

  setCurrentMonth();

  await populatePublishers();
}


function populateYears() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    now.getMonth() + 1;


  const currentSY =
    month >= 9
      ? year + 1
      : year;


  const single =
    document.getElementById(
      "singleYear"
    );


  const batch =
    document.getElementById(
      "batchYear"
    );


  single.innerHTML = "";
  batch.innerHTML = "";


  for (
    let sy =
      Math.max(
        2026,
        currentSY - 1
      );

    sy <= currentSY + 1;

    sy++
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      String(sy);

    option.text =
      `${sy} 봉사연도`;


    if (sy === currentSY) {
      option.selected = true;
    }


    single.appendChild(
      option
    );
  }


  const combined =
    document.createElement(
      "option"
    );

  combined.value =
    "CURRENT_AND_PREV";

  combined.text =
    "현재 + 전년도 (2개년)";

  combined.selected =
    true;


  batch.appendChild(
    combined
  );


  for (
    let sy =
      Math.max(
        2026,
        currentSY - 1
      );

    sy <= currentSY + 1;

    sy++
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      String(sy);

    option.text =
      `${sy} 봉사연도`;

    batch.appendChild(
      option
    );
  }
}


function setCurrentMonth() {

  const now =
    new Date();


  const ym =
    `${now.getFullYear()}-` +
    `${String(
      now.getMonth() + 1
    ).padStart(2, "0")}`;


  document.getElementById(
    "s88Month"
  ).value =
    ym;
}


async function populatePublishers() {

  const list =
    await apiCall(
      "getActivePublishers"
    );


  const select =
    document.getElementById(
      "singlePublisher"
    );


  select.innerHTML =
    `<option value="">전도인을 선택하세요</option>`;


  if (!Array.isArray(list)) {
    return;
  }


  list
    .slice()
    .sort((a, b) =>
      String(
        a.nameKo || ""
      ).localeCompare(
        String(
          b.nameKo || ""
        ),
        "ko"
      )
    )
    .forEach(p => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        p.id;


      option.text =
        `${p.nameKo || p.nameRu || p.nameEn} (${p.group})`;


      select.appendChild(
        option
      );
    });
}


/* =========================================================
   다운로드 도우미
   ========================================================= */

function openDownloadWindow() {

  return window.open(
    "about:blank",
    "_blank"
  );
}


function completeDownload(
  popup,
  url
) {

  if (popup) {

    popup.location.href =
      url;

  } else {

    window.location.href =
      url;
  }
}


/* =========================================================
   S-21 개별
   ========================================================= */

async function downloadSingleS21() {

  const pubId =
    document.getElementById(
      "singlePublisher"
    ).value;


  const year =
    document.getElementById(
      "singleYear"
    ).value;


  if (!pubId) {

    alert(
      "전도인을 선택하세요."
    );

    return;
  }


  const popup =
    openDownloadWindow();


  const btn =
    document.getElementById(
      "btnSingleS21"
    );


  btn.disabled =
    true;

  btn.innerText =
    "⏳ S-21 생성 중...";


  const res =
    await apiCall(
      "exportS21Cards",
      {
        yearOption:
          year,

        roleFilter:
          "ALL",

        publisherId:
          pubId,

        secretaryPubId:
          secretaryPubId,

        secretaryPin:
          secretaryPin
      }
    );


  btn.disabled =
    false;

  btn.innerText =
    "📥 개별 S-21 다운로드";


  if (
    res &&
    res.success &&
    res.downloadUrl
  ) {

    completeDownload(
      popup,
      res.downloadUrl
    );

    return;
  }


  if (popup) {
    popup.close();
  }


  alert(
    res
      ? res.message
      : "S-21 생성에 실패했습니다."
  );
}


/* =========================================================
   S-21 일괄
   ========================================================= */

async function downloadBatchS21() {

  const year =
    document.getElementById(
      "batchYear"
    ).value;


  const role =
    document.getElementById(
      "batchRole"
    ).value;


  const popup =
    openDownloadWindow();


  const btn =
    document.getElementById(
      "btnBatchS21"
    );


  btn.disabled =
    true;

  btn.innerText =
    "⏳ S-21 생성 및 압축 중...";


  const res =
    await apiCall(
      "exportS21Cards",
      {
        yearOption:
          year,

        roleFilter:
          role,

        secretaryPubId:
          secretaryPubId,

        secretaryPin:
          secretaryPin
      }
    );


  btn.disabled =
    false;

  btn.innerText =
    "📥 S-21 일괄 다운로드 (ZIP)";


  if (
    res &&
    res.success &&
    res.downloadUrl
  ) {

    completeDownload(
      popup,
      res.downloadUrl
    );

    return;
  }


  if (popup) {
    popup.close();
  }


  alert(
    res
      ? res.message
      : "S-21 생성에 실패했습니다."
  );
}


/* =========================================================
   S-88 동기화
   ========================================================= */

async function syncS88() {

  const month =
    document.getElementById(
      "s88Month"
    ).value;


  if (!month) {
    return;
  }


  const btn =
    document.getElementById(
      "btnSyncS88"
    );


  btn.disabled = true;
  btn.innerText = "동기화 중...";


  const res =
    await apiCall(
      "syncS88MeetingAttendance",
      {
        yearMonth:
          month,

        secretaryPubId:
          secretaryPubId,

        secretaryPin:
          secretaryPin
      }
    );


  btn.disabled = false;
  btn.innerText =
    "🔄 해당 월 S-88 동기화";


  alert(
    res
      ? res.message
      : "S-88 동기화에 실패했습니다."
  );
}


/* =========================================================
   S-88 다운로드
   ========================================================= */

async function downloadS88() {

  const popup =
    openDownloadWindow();


  const btn =
    document.getElementById(
      "btnDownloadS88"
    );


  btn.disabled = true;
  btn.innerText =
    "⏳ S-88 파일 생성 중...";


  const res =
    await apiCall(
      "downloadS88File",
      {
        secretaryPubId:
          secretaryPubId,

        secretaryPin:
          secretaryPin
      }
    );


  btn.disabled = false;
  btn.innerText =
    "📥 S-88 엑셀 다운로드";


  if (
    res &&
    res.success &&
    res.downloadUrl
  ) {

    completeDownload(
      popup,
      res.downloadUrl
    );

    return;
  }


  if (popup) {
    popup.close();
  }


  alert(
    res
      ? res.message
      : "S-88 다운로드 생성에 실패했습니다."
  );
}

</script>

</body>
</html>
