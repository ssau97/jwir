<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ИР Отчеты</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ИР Отчеты">

  <link rel="icon" type="image/png" href="icon-e.png">
  <link rel="shortcut icon" href="icon-e.png">
  <link rel="apple-touch-icon" href="icon-e.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      border-radius: 16px;
      border: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .nav-tabs .nav-link {
      font-weight: 700;
      color: #495057;
    }

    .nav-tabs .nav-link.active {
      color: #0d6efd;
      border-bottom: 3px solid #0d6efd;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2c3e50;
      border-left: 5px solid #0d6efd;
      padding-left: 10px;
      margin-bottom: 15px;
    }

    .choice-group .btn {
      padding: 14px 0;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 12px;
    }

    .btn-check:checked + .btn-outline-success {
      background-color: #198754;
      color: white;
      border-color: #198754;
    }

    .btn-check:checked + .btn-outline-danger {
      background-color: #dc3545;
      color: white;
      border-color: #dc3545;
    }

    .selected-badge-box {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2e7d32;
      padding: 10px;
      text-align: center;
    }

    .table-pioneer-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .sticky-col-month {
      position: sticky;
      left: 0;
      background-color: #ffffff;
      z-index: 2;
      width: 68px;
      min-width: 68px;
      max-width: 68px;
      text-align: center;
      border-right: 2px solid #dee2e6 !important;
    }

    thead th.sticky-col-month {
      background-color: #f8f9fa !important;
      z-index: 3;
    }

    .nowrap {
      white-space: nowrap;
    }

    /* 사유 및 비고는 줄바꿈하지 않음 */
    .pioneer-remarks-cell {
      white-space: nowrap;
      min-width: 220px;
    }

    /* 파이오니아 연간 합계 */
    .annual-summary-card {
      background: #f1f6ff;
      border: 1px solid #d5e3ff;
    }

    .annual-summary-item {
      text-align: center;
    }

    .annual-summary-label {
      font-size: 0.78rem;
      color: #6c757d;
      font-weight: 700;
      white-space: nowrap;
    }

    .annual-summary-value {
      font-size: 1.25rem;
      font-weight: 800;
    }

    /* 기존 보고 인증 */
    .existing-auth-card {
      border: 1px solid #ffc107;
      background: #fffdf3;
    }

    .report-locked {
      opacity: 0.55;
    }
  </style>
</head>

<body class="py-3">

<div class="container" style="max-width: 560px;">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <span class="badge bg-primary px-3 py-2 fs-6" id="badgeServiceYear">봉사연도</span>

    <div class="btn-group">
      <button class="btn btn-sm btn-outline-secondary" id="btnKo" onclick="setLanguage('ko')">한국어</button>
      <button class="btn btn-sm btn-outline-secondary" id="btnRu" onclick="setLanguage('ru')">Русский</button>
      <button class="btn btn-sm btn-outline-secondary" id="btnEn" onclick="setLanguage('en')">EN</button>
    </div>
  </div>

  <ul class="nav nav-tabs nav-fill mb-3 bg-white rounded-top shadow-sm">
    <li class="nav-item">
      <button class="nav-link active" id="tabBtnReport" onclick="switchMainTab('report')">
        야외봉사 보고
      </button>
    </li>

    <li class="nav-item">
      <button class="nav-link" id="tabBtnPioneer" onclick="switchMainTab('pioneer')">
        파이오니아 개인 기록
      </button>
    </li>
  </ul>


  <!-- =====================================================
       탭 1 : 야외봉사 보고
       ===================================================== -->
  <div id="tabReportSection">

    <div class="text-center mb-3">
      <h4 class="fw-bold" id="txtTitle">회중 야외봉사 보고</h4>
      <div class="fw-bold text-primary fs-5" id="txtCurrentMonth"></div>
    </div>


    <!-- 테스트 모드 -->
    <div
      id="testModeBox"
      class="card p-2 bg-warning-subtle border-warning shadow-sm mb-3"
      style="display:none;"
    >
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

        <span class="badge bg-warning text-dark fw-bold px-2 py-1">
          🧪 테스트 모드
        </span>

        <div class="d-flex align-items-center gap-2">
          <label

      </div>
    </div>


    <!-- 제출기간 종료/대기 -->
    <div
      id="closedAlert"
      class="alert alert-warning text-center fw-bold shadow-sm"
      style="display:none;"
    ></div>


    <form id="serviceForm">

      <!-- 1. 본인 확인 -->
      <div class="card p-3 mb-3">

        <div class="section-title" id="txtSec1">

        </div>

        <div class="mb-3">

          <label class="form-label fw-bold" id="lblSearch">

      <!-- 기존 보고 인증 -->

          maxlength="6"

        <input

          id="existingReportPinConfirm"
          class="form-control form-control-lg text-center mb-3"

      <!-- 2. 봉사 활동 보고 -->

            <input

        <div id="activeFields">

            <input

          <div

            class="mb-3"

        </div>


        <div class="mb-3">

          <label class="form-label fw-bold" id="lblRemarks">
            비고 및 메모 (선택)
          </label>

          <textarea

        </div>


        <button

  <!-- =====================================================
       탭 2 : 파이오니아 개인 기록

    <div id="pioneerAuthBox" class="card p-4 text-center">

      <h5 class="fw-bold mb-3" id="pioneerAuthTitle">

      <p class="text-muted small" id="pioneerAuthDesc">

      <input

      <select

        <option value="">파이오니아 성명 선택</option>
      </select>


      <input
        type="password"
        id="pioneerPin"
        class="form-control form-control-lg text-center mb-2"
        maxlength="6"

      <div class="form-check text-start mb-3">

        <input

        <label

        <div>

          >
            정규 파이오니아
          </span>

          <h4
            class="fw-bold text-dark mb-0"
            id="pioneerNameHeader"

            파이오니아 기록
          </h4>
        </div>

          class="btn btn-outline-secondary fw-bold px-3 py-2 shadow-sm"

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbz_Qn5OrZ39cY4NMkIcsvQQTXrFgjrJ-a9ov3PThyp5oMxfuBoQnR4WkpLHl6cIGRsp/exec";


function getCurrentServiceYear() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;

  return month >= 9 ? year + 1 : year;
}


function getServiceYearFromReportMonth(ym) {

  if (!ym) {
    return getCurrentServiceYear();
  }

  const parts =
    ym.split("-");

  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);

  return month >= 9
    ? year + 1
    : year;
}


function updateServiceYearBadge() {

  const t =
    i18n[currentLang];

  document.getElementById(
    "badgeServiceYear"
  ).innerText =
    t.badge(
      getServiceYearFromReportMonth(
        activeReportMonth
      )
    );
}
  
let currentLang = "ko";

let publishers = [];

let selectedPub = null;
let selectedPioneer = null;

let pioneerAllRecords = null;

let activeReportMonth = "";

let isPeriodOpen = false;
let isTestMode = false;

let reportPhase = "";


/* 기존 보고 상태 */
let existingReportExists = false;
let existingReportAuthenticated = false;
let existingReportHasPin = false;
let existingReportPin = "";

/* 파이오니아 화면에서 수정으로 넘어올 때 중복 PIN 방지 */
let pendingExistingReportPin = "";


const creditOptions = [
  { ko: "베델", ru: "Вефиль", en: "Bethel" },
  { ko: "대회장", ru: "Зал конгрессов", en: "Assembly Hall" },
  { ko: "LDC", ru: "МПСО", en: "LDC" },
  { ko: "순회대회", ru: "Районный конгресс", en: "Circuit Assembly" },
  { ko: "지역대회", ru: "Региональный конгресс", en: "Regional Convention" },
  { ko: "파이오니아 학교", ru: "Школа пионерского служения", en: "Pioneer School" },
  { ko: "회관 유지보수", ru: "Обслуживание Зала Царства", en: "Kingdom Hall Maintenance" },
  { ko: "기타", ru: "Другое", en: "Other" }
];


const i18n = {

  ko: {
    badge: yr => `${yr} 봉사연도`,

    title: "회중 야외봉사 보고",

async function apiCall(action, payload = {}) {

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: action,
        payload: payload
      })
    });

    return await response.json();

  } catch (e) {

    console.error("API 통신 에러:", e);

    return {
      success: false,
      message: "서버 통신에 실패했습니다."
    };
  }
}


/* =========================================================
   초기 실행
   ========================================================= */

window.onload = async function() {

  const userLang =
    (navigator.language || navigator.userLanguage).toLowerCase();

  if (userLang.startsWith("ru")) {
    setLanguage("ru");

  } else if (userLang.startsWith("en")) {
    setLanguage("en");

  } else {
    setLanguage("ko");
  }


  resetCreditRows();


  const timeInfo =
    await apiCall("getActiveReportMonthInfo");


  if (timeInfo) {

    activeReportMonth =
      timeInfo.reportMonth || "";

    isPeriodOpen =
      timeInfo.isOpen === true;

    isTestMode =
      timeInfo.isTestMode === true;

    reportPhase =
      timeInfo.phase || "";


    if (
      isTestMode &&
      Array.isArray(timeInfo.testMonths)
    ) {

      const testBox =
        document.getElementById("testModeBox");

      const testSel =
        document.getElementById("testMonthSelect");

      testSel.innerHTML = "";


      timeInfo.testMonths.forEach(m => {

        const opt =
          document.createElement("option");

        opt.value = m;
        opt.text = m;

        if (m === activeReportMonth) {
          opt.selected = true;
        }

        testSel.appendChild(opt);
      });


      testBox.style.display = "block";
    }


    updateMonthDisplayByStr(
      activeReportMonth
    );

    updateServiceYearBadge();

    updateReportingPeriodUI();
    }


  const data =
    await apiCall("getActivePublishers");


  if (Array.isArray(data)) {

    publishers = data;

    populatePublisherDropdowns();
  }
};

function updateReportingPeriodUI() {

  const alertBox =
    document.getElementById("closedAlert");


  if (isPeriodOpen || isTestMode) {

    alertBox.style.display = "none";

    return;
  }


  const t = i18n[currentLang];


  if (reportPhase === "CURRENT_WAITING") {

    alertBox.innerHTML =
      t.closedWaiting;

  } else {

    alertBox.innerHTML =
      t.closedPrevious;
  }


  alertBox.style.display = "block";


  /* 닫힌 기간에는 봉사 입력란 자체 잠금 */
  lockReportEntry();
}


function lockReportEntry() {

  const card =
    document.getElementById("reportEntryCard");

  card.classList.add("report-locked");


  card.querySelectorAll(
    "input, textarea, select, button"
  ).forEach(el => {

    el.disabled = true;
  });


  document.getElementById("submitBtn").disabled = true;
}


function unlockReportEntry() {

  if (!isPeriodOpen && !isTestMode) {
    lockReportEntry();
    return;
  }


  const card =
    document.getElementById("reportEntryCard");

  card.classList.remove("report-locked");


  card.querySelectorAll(
    "input, textarea, select, button"
  ).forEach(el => {

    el.disabled = false;
  });
}

function updateMonthDisplayByStr(ymStr) {

  if (!ymStr) return;


  const parts = ymStr.split("-");

  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);


  let txt =
    `${year}년 ${month}월`;


  if (currentLang === "en") {

    const names = [
      "Jan.", "Feb.", "Mar.", "Apr.",
      "May", "Jun.", "Jul.", "Aug.",
      "Sep.", "Oct.", "Nov.", "Dec."
    ];

    txt =
      `${names[month - 1]} ${year}`;

  } else if (currentLang === "ru") {

    const names = [
      "Январь", "Февраль", "Март",
      "Апрель", "Май", "Июнь",
      "Июль", "Август", "Сентябрь",
      "Октябрь", "Ноябрь", "Декабрь"
    ];

    txt =
      `${names[month - 1]} ${year} года`;
  }


  document.getElementById(
    "txtCurrentMonth"
  ).innerText = txt;
}

function getDisplayName(p) {

  if (currentLang === "ru") {
    return p.nameRu || p.nameKo || p.nameEn;
  }

  if (currentLang === "en") {
    return p.nameEn || p.nameKo || p.nameRu;
  }

  return p.nameKo || p.nameRu || p.nameEn;
}


function populatePublisherDropdowns() {

  const pubSel =
    document.getElementById("publisherSelect");

  const pioSel =
    document.getElementById("pioneerSelect");


  const curPubVal =
    pubSel.value;

  const curPioVal =
    pioSel.value;


  pubSel.innerHTML =
    `<option value="">${i18n[currentLang].selectPub}</option>`;

  pioSel.innerHTML =
    `<option value="">${i18n[currentLang].selectPio}</option>`;


  publishers.forEach(p => {

    const name =
      getDisplayName(p);


    const opt1 =
      document.createElement("option");

    opt1.value = p.id;

    opt1.text =
      `${name} (${p.group}) [${p.role}]`;

    pubSel.appendChild(opt1);


    if (
      p.role === "정규 파이오니아" ||
      p.role === "특별 파이오니아"
    ) {

      const opt2 =
        document.createElement("option");

      opt2.value = p.id;

      opt2.text =
        `${name} (${p.group})`;

      pioSel.appendChild(opt2);
    }
  });


  pubSel.value =
    curPubVal;

  pioSel.value =
    curPioVal;
}


function filterPublishers() {

  const q =
    document.getElementById(
      "nameSearch"
    ).value.toLowerCase().trim();


  const select =
    document.getElementById(
      "publisherSelect"
    );


  select.innerHTML =
    `<option value="">${i18n[currentLang].selectPub}</option>`;


  const filtered =
    publishers.filter(p =>

      (p.nameKo &&
        p.nameKo.toLowerCase().includes(q)) ||

      (p.nameRu &&
        p.nameRu.toLowerCase().includes(q)) ||

      (p.nameEn &&
        p.nameEn.toLowerCase().includes(q))
    );


  filtered.forEach(p => {

    const opt =
      document.createElement("option");

    opt.value =
      p.id;

    opt.text =
      `${getDisplayName(p)} (${p.group}) [${p.role}]`;

    select.appendChild(opt);
  });


  if (filtered.length === 1) {

    select.value =
      filtered[0].id;

    onPublisherSelectChanged();
  }
}


function filterPioneers() {

  const q =
    document.getElementById(
      "pioneerNameSearch"
    ).value.toLowerCase().trim();


  const select =
    document.getElementById(
      "pioneerSelect"
    );


  select.innerHTML =
    `<option value="">${i18n[currentLang].selectPio}</option>`;


  const filtered =
    publishers.filter(p =>

      (
        p.role === "정규 파이오니아" ||
        p.role === "특별 파이오니아"
      ) &&

      (
        (p.nameKo &&
          p.nameKo.toLowerCase().includes(q)) ||

        (p.nameRu &&
          p.nameRu.toLowerCase().includes(q)) ||

        (p.nameEn &&
          p.nameEn.toLowerCase().includes(q))
      )
    );


  filtered.forEach(p => {

    const opt =
      document.createElement("option");

    opt.value =
      p.id;

    opt.text =
      `${getDisplayName(p)} (${p.group})`;

    select.appendChild(opt);
  });


  if (filtered.length === 1) {

    select.value =
      filtered[0].id;

    onPioneerSelectChanged();
  }
}

async function onPublisherSelectChanged() {

  const pubId =
    document.getElementById(
      "publisherSelect"
    ).value;


  selectedPub =
    publishers.find(
      p => p.id === pubId
    );


  resetExistingReportState();


  if (!selectedPub) {

    document.getElementById(
      "selectedBadge"
    ).style.display = "none";

    resetReportFields();

    lockReportEntry();

    return;
  }


  const nameShow =
    getDisplayName(selectedPub);


  const badge =
    document.getElementById(
      "selectedBadge"
    );


  badge.innerText =
    selectedPub.role === "정규 파이오니아"
      ? `✓ ${nameShow} (정규 파이오니아)`
      : `✓ ${nameShow}`;


  badge.style.display =
    "block";


  configureRoleFields();


  /*
   * 닫힌 기간에는 기존 보고 조회 API 자체를 호출하지 않는다.
   */
  if (
    !isPeriodOpen &&
    !isTestMode
  ) {

    resetReportFields();

    configureRoleFields();

    lockReportEntry();

    return;
  }


  const suppliedPin =
    pendingExistingReportPin;

  pendingExistingReportPin =
    "";


  await checkAndFillExistingReport(
    selectedPub.id,
    activeReportMonth,
    suppliedPin
  );
}


/* =========================================================
   역할별 필드
   ========================================================= */

function configureRoleFields(reportRole = "") {

  if (!selectedPub) return;


  const isPioneer =
    selectedPub.role === "정규 파이오니아" ||
    selectedPub.role === "특별 파이오니아";


  document.getElementById(
    "auxContainer"
  ).style.display =
    isPioneer
      ? "none"
      : "block";


  document.getElementById(
    "hoursContainer"
  ).style.display =
    isPioneer
      ? "block"
      : "none";


  document.getElementById(
    "creditContainer"
  ).style.display =
    selectedPub.role === "정규 파이오니아"
      ? "block"
      : "none";


  if (!isPioneer) {

    const wasAux =
      reportRole === "보조 파이오니아";


    document.getElementById(
      "isAux"
    ).checked =
      wasAux ||
      selectedPub.isContinuousAux === true;


    toggleHours();
  }
}


/* =========================================================
   기존 보고 조회
   ========================================================= */

async function checkAndFillExistingReport(
  pubId,
  month,
  enteredPin = ""
) {

  const btn =
    document.getElementById(
      "submitBtn"
    );


  /*
   * 제출기간이 아니면 호출하지 않는다.
   */
  if (
    !isPeriodOpen &&
    !isTestMode
  ) {

    lockReportEntry();

    return;
  }


  const res =
    await apiCall(
      "getSingleMonthReport",
      {
        pubId: pubId,
        month: month,
        enteredPin: enteredPin
      }
    );


  /*
   * 기간이 닫혔다는 서버 응답
   */
  if (
    res &&
    res.periodClosed
  ) {

    lockReportEntry();

    return;
  }


  /*
   * 신규 보고
   */
  if (
    res &&
    res.exists === false &&
    !res.accessDenied
  ) {

    existingReportExists = false;
    existingReportAuthenticated = false;
    existingReportPin = "";


    document.getElementById(
      "existingReportAuthBox"
    ).style.display = "none";


    resetReportFields();

    configureRoleFields();

    unlockReportEntry();


    btn.innerText =
      i18n[currentLang].submit;

    btn.disabled =
      false;

    return;
  }


  /*
   * 기존 보고가 있지만 아직 인증하지 않음
   */
  if (
    res &&
    res.exists === true &&
    res.authenticated !== true
  ) {

    existingReportExists = true;
    existingReportAuthenticated = false;

    existingReportHasPin =
      res.hasPin === true;


    existingReportPin = "";


    resetReportFields();

    configureRoleFields();

    lockReportEntry();

    renderExistingReportAuthBox();

    return;
  }


  /*
   * PIN 인증 성공
   */
  if (
    res &&
    res.exists === true &&
    res.authenticated === true &&
    res.report
  ) {

    existingReportExists = true;
    existingReportAuthenticated = true;

    existingReportHasPin = true;

    existingReportPin =
      enteredPin;


    document.getElementById(
      "existingReportAuthBox"
    ).style.display = "none";


    fillExistingReport(
      res.report
    );


    unlockReportEntry();


    btn.innerText =
      i18n[currentLang].submitUpdate;

    btn.disabled =
      false;

    return;
  }


  /*
   * 오류
   */
  if (
    res &&
    res.success === false &&
    res.message
  ) {

    alert(res.message);
  }


  lockReportEntry();
}

/* =========================================================
   기존 보고 PIN 인증 / 최초 PIN 설정
   ========================================================= */

async function authenticateExistingReport() {

  if (
    !selectedPub ||
    !existingReportExists
  ) {
    return;
  }


  const pin =
    document.getElementById(
      "existingReportPin"
    ).value.trim();


  if (
    pin.length < 4 ||
    pin.length > 6
  ) {

    alert(
      "PIN은 4자리에서 6자리 사이여야 합니다."
    );

    return;
  }


  /*
   * PIN이 없는 전도인 → 최초 PIN 설정
   */
  if (!existingReportHasPin) {

    const confirmPin =
      document.getElementById(
        "existingReportPinConfirm"
      ).value.trim();


    if (pin !== confirmPin) {

      alert(
        "PIN 확인이 일치하지 않습니다."
      );

      return;
    }


    const setRes =
      await apiCall(
        "changePublisherPin",
        {
          pubId: selectedPub.id,
          currentPin: "",
          newPin: pin
        }
      );


    if (
      !setRes ||
      !setRes.success
    ) {

      alert(
        setRes
          ? setRes.message
          : "PIN 설정에 실패했습니다."
      );

      return;
    }


    existingReportHasPin =
      true;


    /* 현재 브라우저 목록 상태도 갱신 */
    selectedPub.hasPin =
      true;
  }


  await checkAndFillExistingReport(
    selectedPub.id,
    activeReportMonth,
    pin
  );
}

   기존 보고 양식 복원
   ========================================================= */

function fillExistingReport(r) {

  const isPart =
    r.participated === "예";


  document.getElementById(
    "partYes"
  ).checked =
    isPart;


  document.getElementById(
    "partNo"
  ).checked =
    !isPart;


  toggleParticipation(
    isPart
  );


  document.getElementById(
    "actualHours"
  ).value =
    Number(r.hours) || 0;


  document.getElementById(
    "bibleStudies"
  ).value =
    Number(r.studies) || 0;


  /*
   * 기존 추가 인정 사유와 사용자 비고 분리
   */
  const parsed =
    parseStoredRemarks(
      r.remarks || ""
    );


  document.getElementById(
    "remarks"
  ).value =
    parsed.userRemarks;


  restoreCreditRows(
    parsed.creditItems,
    Number(r.credit) || 0
  );


  configureRoleFields(
    r.role || ""
  );
}


/* =========================================================
   저장된 비고 분석
   ========================================================= */

function parseStoredRemarks(raw) {

  let text =
    String(raw || "").trim();


  const creditItems =
    [];


  const match =
    text.match(
      /^\[추가인정:\s*(.*?)\]\s*/
    );


  if (match) {

    const creditText =
      match[1];


    text =
      text
        .replace(match[0], "")
        .trim();


    creditText
      .split(",")
      .forEach(part => {

        const item =
          part.trim();


        const m =
          item.match(
            /^(.*?):\s*([\d.]+)시간$/
          );


        if (m) {

          creditItems.push({
            reason: m[1].trim(),
            hours: Number(m[2]) || 0
          });
        }
      });
  }


  /*
   * 시스템이 붙인 '봉사 미참여' 문구는
   * 사용자가 수정할 때는 제거
   */
  text =
    text.replace(
      /^봉사에 참여 하지 않음\s*\/?\s*/,
      ""
    );


  return {
    creditItems: creditItems,
    userRemarks: text
  };
}

function resetCreditRows() {

    );

function addCreditRow(
  initialHours = 0,
  initialReason = "베델"
) {

  const container =
    document.getElementById(
      "creditRowsContainer"
    );


  const rowId =
    "cr_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 10000);


  const div =
    document.createElement("div");


  div.className =
    "row g-2 mb-2 credit-row";


  div.id =
    rowId;


  let optsHtml =
    "";


  creditOptions.forEach(opt => {

    const label =
      opt[currentLang] ||
      opt.ko;


    const selected =
      opt.ko === initialReason
        ? "selected"
        : "";


    optsHtml +=
      `<option value="${opt.ko}" ${selected}>${label}</option>`;
  });


  const knownOption =
    creditOptions.some(
      opt =>
        opt.ko === initialReason
    );


  div.innerHTML = `
    <div class="col-4">
      <input
        type="number"
        class="form-control credit-val"
        min="0"
        value="${initialHours || 0}"
        placeholder="시간"
      >
    </div>

    <div class="col-6">
      <select
        class="form-select credit-reason-sel"
        onchange="toggleCustomReasonInput('${rowId}')"
      >
        ${optsHtml}
      </select>

      <input
        type="text"
        class="form-control form-control-sm mt-1 credit-custom-text"
        placeholder="기타 사유"
        style="display:none;"
      >
    </div>

    <div class="col-2">
      <button
        type="button"
        class="btn btn-outline-danger w-100"
        onclick="document.getElementById('${rowId}').remove()"
      >
        ✕
      </button>
    </div>
  `;


  container.appendChild(div);


  if (!knownOption) {

    const sel =
      div.querySelector(
        ".credit-reason-sel"
      );


    sel.value =
      "기타";


    const custom =
      div.querySelector(
        ".credit-custom-text"
      );


    custom.value =
      initialReason;


    custom.style.display =
      "block";
  }
}


function restoreCreditRows(
  items,
  totalCredit
) {

  const container =
    document.getElementById(
      "creditRowsContainer"
    );


  container.innerHTML =
    "";


  if (
    Array.isArray(items) &&
    items.length > 0
  ) {

    items.forEach(item => {

      addCreditRow(
        item.hours,
        item.reason
      );
    });

    return;
  }


  /*
   * 기존 데이터에 총 추가시간만 있고
   * 사유 파싱이 안 된 경우에도 시간을 잃지 않음
   */
  if (totalCredit > 0) {

    addCreditRow(
      totalCredit,
      "기타"
    );

    return;
  }


  addCreditRow();
}


function toggleCustomReasonInput(rowId) {

  const row =
    document.getElementById(
      rowId
    );


  const sel =
    row.querySelector(
      ".credit-reason-sel"
    ).value;


  const txt =
    row.querySelector(
      ".credit-custom-text"
    );


  txt.style.display =
    sel === "기타"
      ? "block"
      : "none";
}


/* =========================================================
   보고 제출
   ========================================================= */

async function submitServiceReport() {

  if (!selectedPub) {
    return;
  }


  if (
    !isPeriodOpen &&
    !isTestMode
  ) {

    updateReportingPeriodUI();

    return;
  }


  /*
   * 기존 보고 수정은 반드시 인증 후에만
   */
  if (
    existingReportExists &&
    !existingReportAuthenticated
  ) {

    renderExistingReportAuthBox();

    return;
  }


  const btn =
    document.getElementById(
      "submitBtn"
    );


  btn.disabled =
    true;


  btn.innerText =
    i18n[currentLang].submitting;


  const isParticipated =
    document.getElementById(
      "partYes"
    ).checked
      ? "예"
      : "아니오";


  let totalCredit =
    0;


  const creditList =
    [];


  document
    .querySelectorAll(
      ".credit-row"
    )
    .forEach(row => {

      const val =
        Number(
          row.querySelector(
            ".credit-val"
          ).value
        ) || 0;


      let reason =
        row.querySelector(
          ".credit-reason-sel"
        ).value;


      if (reason === "기타") {

        const custom =
          row.querySelector(
            ".credit-custom-text"
          ).value.trim();


        if (custom) {
          reason = custom;
        }
      }


      if (val > 0) {

        totalCredit +=
          val;


        creditList.push(
          `${reason}: ${val}시간`
        );
      }
    });


  const payload = {

    publisherId:
      selectedPub.id,

    publisherName:
      selectedPub.nameKo ||
      selectedPub.nameRu ||
      selectedPub.nameEn,

    defaultRole:
      selectedPub.role,

    isContinuousAux:
      selectedPub.isContinuousAux,

    reportMonth:
      activeReportMonth,

    participated:
      isParticipated,

    isAux:
      document.getElementById(
        "isAux"
      ).checked,

    actualHours:
      isParticipated === "예"
        ? document.getElementById(
            "actualHours"
          ).value
        : 0,

    creditHours:
      isParticipated === "예"
        ? totalCredit
        : 0,

    creditListText:
      creditList.join(", "),

    bibleStudies:
      isParticipated === "예"
        ? document.getElementById(
            "bibleStudies"
          ).value
        : 0,

    remarks:
      document.getElementById(
        "remarks"
      ).value,

    /*
     * 신규 제출은 빈 값.
     * 기존 보고 수정은 인증했던 PIN 전달.
     */
    enteredPin:
      existingReportExists
        ? existingReportPin
        : ""
  };


  const res =
    await apiCall(
      "submitReport",
      payload
    );


  if (
  res &&
  res.success
) {

  alert(
    `【 제출 성공 | Отчёт успешно отправлен 】\n\n${res.message}`
  );

  existingReportExists =
    true;

  existingReportAuthenticated =
    false;

  existingReportPin =
    "";

  existingReportHasPin =
    selectedPub.hasPin === true;

  /*
   * 제출 완료 후 입력란은 잠그지만
   * PIN 설정을 즉시 요구하지 않는다.
   *
   * 사용자가 다시 전도인을 선택하거나
   * 기존 보고를 열려고 할 때만
   * PIN 인증 화면을 표시한다.
   */
  document.getElementById(
    "existingReportAuthBox"
  ).style.display =
    "none";

  lockReportEntry();

} else {

  alert(
    `【 제출 실패 | Ошибка отправки 】\n\n${res ? res.message : ""}`
  );

  /*
   * 저장 도중 서버에서 PIN 재인증을 요구한 경우
   */
  if (
    res &&
    res.requiresPin
  ) {

    existingReportExists =
      true;

    existingReportAuthenticated =
      false;

    existingReportPin =
      "";

    existingReportHasPin =
      true;

    lockReportEntry();

    renderExistingReportAuthBox();

    return;
  }

  /*
   * 일반적인 저장 실패
   */
  if (
    existingReportAuthenticated
  ) {

    unlockReportEntry();

    btn.disabled =
      false;

    btn.innerText =
      i18n[currentLang].submitUpdate;

  } else {

    btn.disabled =
      false;

    btn.innerText =
      i18n[currentLang].submit;
  }
}

function renderPioneerRecordTable() {

  if (!pioneerAllRecords) {
    return;
  }


  const yr =
    Number(
      document.getElementById(
        "pioneerYearFilter"
      ).value
    ) ||
    getCurrentServiceYear();


  const startYr =
    yr - 1;


  const months = [
    `${startYr}-09`,
    `${startYr}-10`,
    `${startYr}-11`,
    `${startYr}-12`,

    `${yr}-01`,
    `${yr}-02`,
    `${yr}-03`,
    `${yr}-04`,
    `${yr}-05`,
    `${yr}-06`,
    `${yr}-07`,
    `${yr}-08`
  ];


  const tb =
    document.getElementById(
      "pioneerRecordTable"
    );


  tb.innerHTML =
    "";


  let sumHours =
    0;


  let sumCredit =
    0;


  months.forEach(m => {

    const r =
      pioneerAllRecords[m] || {
        participated: "-",
        hours: 0,
        credit: 0,
        studies: 0,
        remarks: ""
      };


    const tr =
      document.createElement(
        "tr"
      );


    const mNum =
      Number(
        m.split("-")[1]
      );


    const monthLabel =
      i18n[currentLang]
        .monthName(mNum);


    const isPart =
      r.participated === "예";


    const hVal =
      Number(r.hours) || 0;


    const cVal =
      Number(r.credit) || 0;


    const sVal =
      Number(r.studies) || 0;


    if (isPart) {

      sumHours +=
        hVal;

      sumCredit +=
        cVal;
    }


    tr.innerHTML = `
      <td class="sticky-col-month nowrap">
        <strong>${escapeHtml(monthLabel)}</strong>
      </td>

      <td>
        ${sVal > 0 ? sVal : ""}
      </td>

      <td class="fw-bold">
        ${hVal > 0 ? hVal : ""}
      </td>

      <td>
        ${cVal > 0 ? cVal : ""}
      </td>

      <td class="text-start small text-secondary pioneer-remarks-cell">
        ${escapeHtml(r.remarks || "")}
      </td>
    `;


    tb.appendChild(
      tr
    );
  });


  document.getElementById(
    "annualHoursValue"
  ).innerText =
    sumHours;


  document.getElementById(
    "annualCreditValue"
  ).innerText =
    sumCredit;


  document.getElementById(
    "annualTotalValue"
  ).innerText =
    sumHours +
    sumCredit;
}


/* =========================================================
   HTML escaping
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   파이오니아 화면 초기화
   ========================================================= */

function resetPioneerView() {

  document.getElementById(
    "pioneerRecordDisplay"
  ).style.display =

  document.getElementById(
    "pioneerAuthBox"
  ).style.display =

/* =========================================================
   파이오니아 → 현재 보고 수정
   ========================================================= */

async function openPioneerEditModal() {

  if (!selectedPioneer) {
    return;
  }


  const entered =
    prompt(
      `[${selectedPioneer.nameKo || selectedPioneer.nameRu}] 님의 비밀번호(PIN)를 입력하세요.\nВведите PIN-код для подтверждения:`
    );


  if (!entered) {
    return;
  }


  const verifyRes =
    await apiCall(
      "getPioneerYearlyRecord",
      {
        pubId:
          selectedPioneer.id,

        enteredPin:
          entered
      }
    );


  if (
    !verifyRes ||
    !verifyRes.success
  ) {

    alert(
      "【 인증 실패 | Ошибка авторизации 】\n\n비밀번호가 일치하지 않습니다."
    );

    return;
  }


  /*
   * 보고 탭에서 다시 PIN을 묻지 않도록
   * 한 번만 사용할 인증값 전달
   */
  pendingExistingReportPin =
    entered;


  switchMainTab(
    "report"
  );


  document.getElementById(
    "publisherSelect"
  ).value =
    selectedPioneer.id;


  await onPublisherSelectChanged();
}


/* =========================================================
   파이오니아 PIN 변경
   ========================================================= */

async function submitChangePin() {

  const cur =
    document.getElementById(
      "curPin"
    ).value.trim();


  const n1 =
    document.getElementById(
      "newPin"
    ).value.trim();


  const n2 =
    document.getElementById(
      "confirmPin"
    ).value.trim();


  if (!cur) {

    alert(
      "현재 비밀번호를 입력하세요."
    );

    return;
  }


  if (
    !n1 ||
    n1.length < 4 ||
    n1.length > 6
  ) {

    alert(
      "새 비밀번호는 4자리에서 6자리 사이여야 합니다."
    );

    return;
  }


  if (n1 !== n2) {

    alert(
      "새 비밀번호 확인이 일치하지 않습니다."
    );

    return;
  }


  const btn =
    document.getElementById(
      "btnChangePin"
    );


  btn.disabled =
    true;


  btn.innerText =
    "변경 처리 중...";


  const res =
    await apiCall(
      "changePublisherPin",
      {
        pubId:
          selectedPioneer.id,

        currentPin:
          cur,

        newPin:
          n1
      }
    );


  btn.disabled =
    false;


  btn.innerText =
    i18n[currentLang]
      .pinSubmit;


  alert(
    res.message
  );


  if (res.success) {

    localStorage.setItem(
      "saved_pin_" +
      selectedPioneer.id,
      n1
    );


    document.getElementById(
      "curPin"
    ).value =
      "";


    document.getElementById(
      "newPin"
    ).value =
      "";


    document.getElementById(
      "confirmPin"
    ).value =
      "";
  }
}

</script>
