<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ИР Отчеты</title>

  <!-- 모바일 홈 화면 추가(PWA) 및 브라우저 파비콘 메타 태그 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ИР Отчеты">
  <link rel="icon" type="image/png" href="icon-e.png">
  <link rel="shortcut icon" href="icon-e.png">
  <link rel="apple-touch-icon" href="icon-e.png">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { border-radius: 16px; border: none; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .nav-tabs .nav-link { font-weight: 700; color: #495057; }
    .nav-tabs .nav-link.active { color: #0d6efd; border-bottom: 3px solid #0d6efd; }
    .section-title { font-size: 1.1rem; font-weight: 700; color: #2c3e50; border-left: 5px solid #0d6efd; padding-left: 10px; margin-bottom: 15px; }
    .choice-group .btn { padding: 14px 0; font-size: 1.15rem; font-weight: 700; border-radius: 12px; }
    .btn-check:checked + .btn-outline-success { background-color: #198754; color: white; border-color: #198754; }
    .btn-check:checked + .btn-outline-danger { background-color: #dc3545; color: white; border-color: #dc3545; }
    .selected-badge-box { background: #e8f5e9; border: 2px solid #4caf50; border-radius: 12px; font-size: 1.2rem; font-weight: bold; color: #2e7d32; padding: 10px; text-align: center; }
  </style>
</head>
<body class="py-3">
<div class="container" style="max-width: 560px;">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <span class="badge bg-primary px-3 py-2 fs-6" id="badgeServiceYear">봉사연도</span>
    <div class="btn-group">
      <button class="btn btn-sm btn-outline-secondary" id="btnKo" onclick="setLanguage('ko')">한국어</button>
      <button class="btn btn-sm btn-outline-secondary" id="btnRu" onclick="setLanguage('ru')">Русский</button>
      <button class="btn btn-sm btn-outline-secondary" id="btnEn" onclick="setLanguage('en')">EN</button>
    </div>
  </div>

  <ul class="nav nav-tabs nav-fill mb-3 bg-white rounded-top shadow-sm">
    <li class="nav-item">
      <button class="nav-link active" id="tabBtnReport" onclick="switchMainTab('report')">야외봉사 보고</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tabBtnPioneer" onclick="switchMainTab('pioneer')">파이오니아 개인 기록</button>
    </li>
  </ul>

  <!-- [탭 1: 야외봉사 보고] -->
  <div id="tabReportSection">
    <div class="text-center mb-3">
      <h4 class="fw-bold" id="txtTitle">회중 야외봉사 보고</h4>
      <div class="fw-bold text-primary fs-5" id="txtCurrentMonth"></div>
    </div>

    <!-- ⭐️ [테스트 모드 전용 툴바]: 원하는 봉사월을 자유롭게 선택하여 입력 가능 -->
    <div id="testModeBox" class="card p-2 bg-warning-subtle border-warning shadow-sm mb-3" style="display:none;">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="badge bg-warning text-dark fw-bold px-2 py-1">🧪 테스트 모드</span>
        <div class="d-flex align-items-center gap-2">
          <label for="testMonthSelect" class="form-label mb-0 fw-bold small text-dark">입력 봉사월:</label>
          <select id="testMonthSelect" class="form-select form-select-sm fw-bold border-dark w-auto" onchange="onTestMonthChanged()"></select>
        </div>
      </div>
    </div>

    <div id="closedAlert" class="alert alert-warning text-center fw-bold shadow-sm" style="display:none;"></div>

    <form id="serviceForm">
      <div class="card p-3 mb-3">
        <div class="section-title" id="txtSec1">1. 본인 확인</div>
        <div class="mb-3">
          <label class="form-label fw-bold" id="lblSearch">성명 선택 및 검색</label>
          <input type="text" id="nameSearch" class="form-control mb-2" placeholder="이름 검색 (검색어 입력 시 자동 필터링)" oninput="filterPublishers()" autocomplete="off">
          <select id="publisherSelect" class="form-select form-select-lg" onchange="onPublisherSelectChanged()">
            <option value="" id="optSelectPub">전도인을 선택하세요</option>
          </select>
          <div id="selectedBadge" class="mt-3 selected-badge-box" style="display:none;"></div>
        </div>
      </div>

      <div class="card p-3 mb-3">
        <div class="section-title" id="txtSec2">2. 봉사 활동 보고</div>

        <label class="form-label fw-bold mb-2" id="lblParticipated">이번 달 야외 봉사에 참여하셨습니까?</label>
        <div class="row g-2 choice-group mb-3">
          <div class="col-6">
            <input type="radio" class="btn-check" name="participateChoice" id="partYes" value="예" checked onchange="toggleParticipation(true)">
            <label class="btn btn-outline-success w-100" for="partYes" id="btnYes">✓ 예 (참여함)</label>
          </div>
          <div class="col-6">
            <input type="radio" class="btn-check" name="participateChoice" id="partNo" value="아니오" onchange="toggleParticipation(false)">
            <label class="btn btn-outline-danger w-100" for="partNo" id="btnNo">✕ 아니오</label>
          </div>
        </div>

        <div id="activeFields">
          <div class="mb-3">
            <label class="form-label fw-bold" id="lblStudies">사회한 개별 성서 연구 건수</label>
            <input type="number" id="bibleStudies" class="form-control form-control-lg" min="0" value="0">
          </div>

          <div id="auxContainer" class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="isAux" onchange="toggleHours()">
            <label class="form-check-label fw-bold" for="isAux" id="lblAux">이번 달 보조 파이오니아 활동함</label>
          </div>

          <div id="hoursContainer" class="mb-3" style="display:none;">
            <label class="form-label fw-bold text-primary" id="lblHours">봉사 시간 (필수)</label>
            <input type="number" id="actualHours" class="form-control form-control-lg border-primary" min="0" placeholder="시간 입력">
          </div>

          <div id="creditContainer" class="mb-3" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label fw-bold text-secondary mb-0" id="lblCredit">추가 인정 시간</label>
              <button type="button" class="btn btn-sm btn-outline-success fw-bold" onclick="addCreditRow()">+ 사유 추가</button>
            </div>
            <div id="creditRowsContainer"></div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold" id="lblRemarks">비고 및 메모 (선택)</label>
          <textarea id="remarks" class="form-control" rows="2"></textarea>
        </div>

        <button type="button" id="submitBtn" class="btn btn-primary btn-lg w-100 fw-bold shadow" onclick="submitServiceReport()" disabled>보고서 제출하기</button>
      </div>
    </form>
  </div>

  <!-- [탭 2: 파이오니아 개인 기록] -->
  <div id="tabPioneerSection" style="display:none;">
    <div id="pioneerAuthBox" class="card p-4 text-center">
      <h5 class="fw-bold mb-3" id="pioneerAuthTitle">정규 파이오니아 기록 열람</h5>
      <p class="text-muted small" id="pioneerAuthDesc">성명을 선택하고 비밀번호(PIN)를 입력하세요.</p>
      
      <input type="text" id="pioneerNameSearch" class="form-control mb-2" placeholder="파이오니아 이름 검색 (자동 필터링)" oninput="filterPioneers()" autocomplete="off">
      <select id="pioneerSelect" class="form-select form-select-lg mb-3" onchange="onPioneerSelectChanged()">
        <option value="" id="optPioneerSelect">파이오니아 성명 선택</option>
      </select>
      <input type="password" id="pioneerPin" class="form-control form-control-lg text-center mb-2" maxlength="6" placeholder="PIN (4~6자리)">
      
      <div class="form-check text-start mb-3">
        <input class="form-check-input" type="checkbox" id="chkRememberPin" checked>
        <label class="form-check-label small text-muted" for="chkRememberPin" id="lblRememberPin">이 기기에서 비밀번호(PIN) 기억하기</label>
      </div>

      <button class="btn btn-primary btn-lg w-100 fw-bold shadow" id="btnPioneerLogin" onclick="loadPioneerData()">기록 조회하기</button>
    </div>

    <!-- 파이오니아 기록 조회 및 비밀번호 변경 카드 -->
    <div id="pioneerRecordDisplay" class="card p-3 p-md-4" style="display:none;">
      
      <!-- 1. 상단 타이틀 & 뒤로가기 버튼 -->
      <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
        <div>
          <span class="badge bg-primary-subtle text-primary fw-bold mb-1" id="badgePioneerRole">정규 파이오니아</span>
          <h4 class="fw-bold text-dark mb-0" id="pioneerNameHeader">파이오니아 기록</h4>
        </div>
        <button class="btn btn-outline-secondary fw-bold px-3 py-2 shadow-sm" id="btnPioneerBack" onclick="resetPioneerView()">
          ← 뒤로가기
        </button>
      </div>

      <!-- 2. 봉사연도 선택 대형 툴바 -->
      <div class="card p-2 bg-light border-0 shadow-sm mb-3">
        <div class="row g-2 align-items-center">
          <div class="col-4 col-sm-3 text-center">
            <label for="pioneerYearFilter" class="form-label fw-bold text-secondary mb-0" id="lblPioneerYear">📅 봉사연도</label>
          </div>
          <div class="col-8 col-sm-9">
            <select id="pioneerYearFilter" class="form-select form-select-lg fw-bold text-primary border-primary shadow-sm" onchange="renderPioneerRecordTable()"></select>
          </div>
        </div>
      </div>

      <div id="pioneerEditAlert" class="alert alert-warning d-flex justify-content-between align-items-center mb-3 shadow-sm" style="display:none;">
        <span id="pioneerEditText" class="fw-bold">이번 달 보고를 수정할 수 있습니다.</span>
        <button class="btn btn-sm btn-dark fw-bold px-3" onclick="openPioneerEditModal()">수정하기</button>
      </div>

      <!-- 3. 12개월 표 및 연간 합계 -->
      <div class="table-responsive mb-4 rounded border shadow-sm">
        <table class="table table-bordered table-hover text-center align-middle mb-0" style="font-size: 0.95rem;">
          <thead class="table-light">
            <tr>
              <th id="thMonth">봉사월</th>
              <th id="thPart">참여</th>
              <th id="thHours">시간</th>
              <th id="thCredit">추가</th>
              <th id="thStudies">연구</th>
            </tr>
          </thead>
          <tbody id="pioneerRecordTable"></tbody>
          <tfoot class="table-light fw-bold" id="pioneerRecordTotalFoot"></tfoot>
        </table>
      </div>

      <!-- 4. 비밀번호(PIN) 변경 섹션 -->
      <div class="card p-3 p-md-4 bg-light border-0 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
          <h5 class="fw-bold text-primary mb-0" id="txtPinChangeTitle">🔐 비밀번호(PIN) 변경</h5>
          <span class="badge bg-secondary">4~6자리</span>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary mb-1" id="lblPinCur">현재 비밀번호</label>
          <input type="password" id="curPin" class="form-control form-control-lg text-center" maxlength="6" placeholder="현재 비밀번호">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary mb-1" id="lblPinNew">새 비밀번호 (4~6자리)</label>
          <input type="password" id="newPin" class="form-control form-control-lg text-center" maxlength="6" placeholder="새 비밀번호 입력">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary mb-1" id="lblPinConfirm">새 비밀번호 확인</label>
          <input type="password" id="confirmPin" class="form-control form-control-lg text-center" maxlength="6" placeholder="새 비밀번호 재입력">
        </div>

        <button class="btn btn-success btn-lg fw-bold w-100 shadow-sm" id="btnChangePin" onclick="submitChangePin()">비밀번호 변경 완료</button>
      </div>

    </div>
  </div>

</div>

    const year = now.getFullYear();
    const month = now.getMonth() + 1;

      rememberPin: "Remember PIN on this device",
      pioneerYearOpt: (yr) => `${yr} Service Year`,
      btnBack: "← Back", lblYearFilter: "📅 Service Year", pioneerBadge: "Regular Pioneer"
    }
  };

  /**
   * Google Apps Script REST API 통신 라우터 (POST)
   */
  async function apiCall(action, payload = {}) {
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: action, payload: payload })
      });
      return await response.json();
    } catch (e) {
      console.error("API 통신 에러:", e);
      return { success: false, message: "서버 통신에 실패했습니다." };
    }
  }

  window.onload = async function() {
    const userLang = (navigator.language || navigator.userLanguage).toLowerCase();
    if (userLang.startsWith("ru")) setLanguage('ru');
    else if (userLang.startsWith("en")) setLanguage('en');
    else setLanguage('ko');

    addCreditRow();

    const timeInfo = await apiCall("getActiveReportMonthInfo");
    if (timeInfo) {
      activeReportMonth = timeInfo.reportMonth;
      isPeriodOpen = timeInfo.isOpen;
      isTestMode = timeInfo.isTestMode || false;

      // ⭐️ 테스트 모드일 때 상단에 봉사월 직접 선택 드롭다운 생성
      if (isTestMode && Array.isArray(timeInfo.testMonths)) {
        const testBox = document.getElementById("testModeBox");
        const testSel = document.getElementById("testMonthSelect");
        testSel.innerHTML = "";
        timeInfo.testMonths.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m;
          opt.text = m;
          if (m === activeReportMonth) opt.selected = true;
          testSel.appendChild(opt);
        });
        testBox.style.display = "block";
      }

      updateMonthDisplayByStr(activeReportMonth);

      if (!isPeriodOpen && !isTestMode) {
        document.getElementById("closedAlert").style.display = "block";
        document.getElementById("submitBtn").disabled = true;
      }
    }

    const data = await apiCall("getActivePublishers");
    if (Array.isArray(data)) {
      publishers = data;
      populatePublisherDropdowns();
    }
  };

  // ⭐️ 테스트 봉사월 변경 시 호출
  async function onTestMonthChanged() {
    activeReportMonth = document.getElementById("testMonthSelect").value;
    updateMonthDisplayByStr(activeReportMonth);
    if (selectedPub) {
      await checkAndFillExistingReport(selectedPub.id, activeReportMonth);
    }
  }

  function updateMonthDisplayByStr(ymStr) {
    if (!ymStr) return;
    const parts = ymStr.split("-");
    const year = Number(parts[0]);
    const month = Number(parts[1]);

    let txt = `${year}년 ${month}월`;
    if (currentLang === 'en') {
      const mNames = ["Jan.", "Feb.", "Mar.", "Apr.", "May", "Jun.", "Jul.", "Aug.", "Sep.", "Oct.", "Nov.", "Dec."];
      txt = `${mNames[month-1]} ${year}`;
    } else if (currentLang === 'ru') {
      const mNamesRu = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
      txt = `${mNamesRu[month-1]} ${year} года`;
    }
    document.getElementById("txtCurrentMonth").innerText = txt;
  }

  function setLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('btn-primary', 'text-white'));
    document.getElementById('btn' + lang.charAt(0).toUpperCase() + lang.slice(1)).classList.add('btn-primary', 'text-white');

    const t = i18n[lang];
    const serviceYear = getCurrentServiceYear();
    document.getElementById("badgeServiceYear").innerText = t.badge(serviceYear);

    document.getElementById("txtTitle").innerText = t.title;
    document.getElementById("txtSec1").innerText = t.sec1;
    document.getElementById("nameSearch").placeholder = t.searchPh;
    document.getElementById("pioneerNameSearch").placeholder = t.pioneerSearchPh;
    document.getElementById("tabBtnReport").innerText = t.tabReport;
    document.getElementById("tabBtnPioneer").innerText = t.tabPioneer;
    document.getElementById("closedAlert").innerHTML = t.closedMsg;
    document.getElementById("txtSec2").innerText = t.sec2;
    document.getElementById("lblParticipated").innerText = t.partQ;
    document.getElementById("btnYes").innerText = t.yes;
    document.getElementById("btnNo").innerText = t.no;
    document.getElementById("lblStudies").innerText = t.studies;
    document.getElementById("lblAux").innerText = t.aux;
    document.getElementById("lblHours").innerText = t.hours;
    document.getElementById("lblCredit").innerText = t.credit;
    document.getElementById("lblRemarks").innerText = t.remarks;
    document.getElementById("remarks").placeholder = t.remarksPh;
    document.getElementById("submitBtn").innerText = t.submit;

    document.getElementById("pioneerAuthTitle").innerText = t.pioneerTitle;
    document.getElementById("pioneerAuthDesc").innerText = t.pioneerDesc;
    document.getElementById("lblRememberPin").innerText = t.rememberPin;
    document.getElementById("btnPioneerLogin").innerText = t.pioneerLogin;
    document.getElementById("thMonth").innerText = t.thMonth;
    document.getElementById("thPart").innerText = t.thPart;
    document.getElementById("thHours").innerText = t.thHours;
    document.getElementById("thCredit").innerText = t.thCredit;
    document.getElementById("thStudies").innerText = t.thStudies;
    
    document.getElementById("btnPioneerBack").innerText = t.btnBack;
    document.getElementById("lblPioneerYear").innerText = t.lblYearFilter;
    document.getElementById("badgePioneerRole").innerText = t.pioneerBadge;

    document.getElementById("txtPinChangeTitle").innerText = t.pinTitle;
    document.getElementById("lblPinCur").innerText = t.pinCur;
    document.getElementById("lblPinNew").innerText = t.pinNew;
    document.getElementById("lblPinConfirm").innerText = t.pinConfirm;
    document.getElementById("curPin").placeholder = t.pinCur;
    document.getElementById("newPin").placeholder = t.pinNew;
    document.getElementById("confirmPin").placeholder = t.pinConfirm;
    document.getElementById("btnChangePin").innerText = t.pinSubmit;

    populatePublisherDropdowns();
  }

  function switchMainTab(tab) {
    document.getElementById("tabReportSection").style.display = tab === 'report' ? 'block' : 'none';
    document.getElementById("tabPioneerSection").style.display = tab === 'pioneer' ? 'block' : 'none';
    document.getElementById("tabBtnReport").classList.toggle("active", tab === 'report');
    document.getElementById("tabBtnPioneer").classList.toggle("active", tab === 'pioneer');
  }

  function getDisplayName(p) {
    if (currentLang === 'ru') return p.nameRu || p.nameKo || p.nameEn;
    if (currentLang === 'en') return p.nameEn || p.nameKo || p.nameRu;
    return p.nameKo || p.nameRu || p.nameEn;
  }

  function populatePublisherDropdowns() {
    const pubSel = document.getElementById("publisherSelect");
    const pioSel = document.getElementById("pioneerSelect");
    const curPubVal = pubSel.value;
    const curPioVal = pioSel.value;

    pubSel.innerHTML = `<option value="">${i18n[currentLang].selectPub}</option>`;
    pioSel.innerHTML = `<option value="">${i18n[currentLang].selectPio}</option>`;

    publishers.forEach(p => {
      const name = getDisplayName(p);
      const opt1 = document.createElement("option");
      opt1.value = p.id;
      opt1.text = `${name} (${p.group}) [${p.role}]`;
      pubSel.appendChild(opt1);

      if (p.role.includes("파이오니아")) {
        const opt2 = document.createElement("option");
        opt2.value = p.id;
        opt2.text = `${name} (${p.group})`;
        pioSel.appendChild(opt2);
      }
    });

    pubSel.value = curPubVal;
    pioSel.value = curPioVal;
  }

  function filterPublishers() {
    const q = document.getElementById("nameSearch").value.toLowerCase().trim();
    const select = document.getElementById("publisherSelect");
    select.innerHTML = `<option value="">${i18n[currentLang].selectPub}</option>`;

    const filtered = publishers.filter(p => 
      (p.nameKo && p.nameKo.toLowerCase().includes(q)) ||
      (p.nameRu && p.nameRu.toLowerCase().includes(q)) ||
      (p.nameEn && p.nameEn.toLowerCase().includes(q))
    );

    filtered.forEach(p => {
      const name = getDisplayName(p);
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.text = `${name} (${p.group}) [${p.role}]`;
      select.appendChild(opt);
    });

    if (filtered.length === 1) {
      select.value = filtered[0].id;
      onPublisherSelectChanged();
    }
  }

  function filterPioneers() {
    const q = document.getElementById("pioneerNameSearch").value.toLowerCase().trim();
    const select = document.getElementById("pioneerSelect");
    select.innerHTML = `<option value="">${i18n[currentLang].selectPio}</option>`;

    const filtered = publishers.filter(p => 
      p.role.includes("파이오니아") && (
        (p.nameKo && p.nameKo.toLowerCase().includes(q)) ||
        (p.nameRu && p.nameRu.toLowerCase().includes(q)) ||
        (p.nameEn && p.nameEn.toLowerCase().includes(q))
      )
    );

    filtered.forEach(p => {
      const name = getDisplayName(p);
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.text = `${name} (${p.group})`;
      select.appendChild(opt);
    });

    if (filtered.length === 1) {
      select.value = filtered[0].id;
      onPioneerSelectChanged();
    }
  }

  async function onPublisherSelectChanged() {
    const pubId = document.getElementById("publisherSelect").value;
    selectedPub = publishers.find(p => p.id === pubId);
    if (selectedPub) {
      const nameShow = getDisplayName(selectedPub);
      const badgeText = selectedPub.role === "정규 파이오니아" ? `✓ ${nameShow} (정규 파이오니아)` : `✓ ${nameShow}`;
      const badge = document.getElementById("selectedBadge");
      badge.innerText = badgeText;
      badge.style.display = "block";

      const isPioneer = selectedPub.role.includes("파이오니아");
      document.getElementById("auxContainer").style.display = isPioneer ? "none" : "block";
      document.getElementById("hoursContainer").style.display = isPioneer ? "block" : "none";
      document.getElementById("creditContainer").style.display = selectedPub.role === "정규 파이오니아" ? "block" : "none";
      
      if (!isPioneer) {
        document.getElementById("isAux").checked = selectedPub.isContinuousAux;
        toggleHours();
      }

      await checkAndFillExistingReport(selectedPub.id, activeReportMonth);
    }
  }

  // ⭐️ 기존 보고 조회 및 폼 자동 채우기
  async function checkAndFillExistingReport(pubId, month) {
    const btn = document.getElementById("submitBtn");
    const res = await apiCall("getSingleMonthReport", { pubId: pubId, month: month });

    if (res && res.exists) {
      const r = res.report;
      const isPart = r.participated === "예";
      document.getElementById("partYes").checked = isPart;
      document.getElementById("partNo").checked = !isPart;
      toggleParticipation(isPart);
      document.getElementById("actualHours").value = r.hours || 0;
      document.getElementById("bibleStudies").value = r.studies || 0;
      document.getElementById("remarks").value = r.remarks || "";

      btn.innerText = i18n[currentLang].submitUpdate || "수정하여 저장하기";
      btn.disabled = false;
    } else {
      document.getElementById("partYes").checked = true;
      document.getElementById("partNo").checked = false;
      toggleParticipation(true);
      document.getElementById("actualHours").value = "";
      document.getElementById("bibleStudies").value = "0";
      document.getElementById("remarks").value = "";

      btn.innerText = i18n[currentLang].submit;
      btn.disabled = !isPeriodOpen && !isTestMode;
    }
  }

  function toggleParticipation(isYes) {
    document.getElementById("activeFields").style.display = isYes ? "block" : "none";
  }

  function toggleHours() {
    const isAux = document.getElementById("isAux").checked;
    document.getElementById("hoursContainer").style.display = isAux ? "block" : "none";
  }

  function addCreditRow() {
    const container = document.getElementById("creditRowsContainer");
    const rowId = "cr_" + Date.now();
    const div = document.createElement("div");
    div.className = "row g-2 mb-2 credit-row";
    div.id = rowId;

    let optsHtml = "";
    creditOptions.forEach(opt => {
      const label = opt[currentLang] || opt.ko;
      optsHtml += `<option value="${opt.ko}">${label}</option>`;
    });

    div.innerHTML = `
      <div class="col-4">
        <input type="number" class="form-control credit-val" min="0" value="0" placeholder="시간">
      </div>
      <div class="col-6">
        <select class="form-select credit-reason-sel" onchange="toggleCustomReasonInput('${rowId}')">
          ${optsHtml}
        </select>
        <input type="text" class="form-control form-control-sm mt-1 credit-custom-text" placeholder="기타 사유" style="display:none;">
      </div>
      <div class="col-2">
        <button type="button" class="btn btn-outline-danger w-100" onclick="document.getElementById('${rowId}').remove()">✕</button>
      </div>
    `;
    container.appendChild(div);
  }

  function toggleCustomReasonInput(rowId) {
    const row = document.getElementById(rowId);
    const sel = row.querySelector(".credit-reason-sel").value;
    const txt = row.querySelector(".credit-custom-text");
    txt.style.display = sel === "기타" ? "block" : "none";
  }

  async function submitServiceReport() {
    if (!selectedPub) return;
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = i18n[currentLang].submitting;

    const isParticipated = document.getElementById("partYes").checked ? "예" : "아니오";
    
    let totalCredit = 0;
    const creditList = [];
    document.querySelectorAll(".credit-row").forEach(row => {
      const val = Number(row.querySelector(".credit-val").value) || 0;
      let rVal = row.querySelector(".credit-reason-sel").value;
      if (rVal === "기타") {
        const cVal = row.querySelector(".credit-custom-text").value.trim();
        if (cVal) rVal = cVal;
      }
      if (val > 0) {
        totalCredit += val;
        creditList.push(`${rVal}: ${val}시간`);
      }
    });

    const payload = {
      publisherId: selectedPub.id,
      publisherName: selectedPub.nameKo || selectedPub.nameRu || selectedPub.nameEn,
      defaultRole: selectedPub.role,
      isContinuousAux: selectedPub.isContinuousAux,
      reportMonth: activeReportMonth,
      participated: isParticipated,
      isAux: document.getElementById("isAux").checked,
      actualHours: isParticipated === "예" ? document.getElementById("actualHours").value : 0,
      creditHours: isParticipated === "예" ? totalCredit : 0,
      creditListText: creditList.join(", "),
      bibleStudies: isParticipated === "예" ? document.getElementById("bibleStudies").value : 0,
      remarks: document.getElementById("remarks").value
    };

    const res = await apiCall("submitReport", payload);
    alert(res.message);
    btn.disabled = false;
    btn.innerText = i18n[currentLang].submitUpdate || "수정하여 저장하기";
  }

  // --- 파이오니아 개인 기록 & PIN 기억하기 ---
  function onPioneerSelectChanged() {
    const pioId = document.getElementById("pioneerSelect").value;
    if (pioId) {
      const savedPin = localStorage.getItem("saved_pin_" + pioId);
      document.getElementById("pioneerPin").value = savedPin || "";
    }
  }

  async function loadPioneerData() {
    const pioId = document.getElementById("pioneerSelect").value;
    if (!pioId) { alert(i18n[currentLang].selectPio); return; }
    const pin = document.getElementById("pioneerPin").value;

    const res = await apiCall("getPioneerYearlyRecord", { pubId: pioId, enteredPin: pin });
    if (res && res.success) {
      if (document.getElementById("chkRememberPin").checked) {
        localStorage.setItem("saved_pin_" + pioId, pin);
      } else {
        localStorage.removeItem("saved_pin_" + pioId);
      }

      selectedPioneer = res.publisher;
      pioneerAllRecords = res.records;

      document.getElementById("pioneerAuthBox").style.display = "none";
      document.getElementById("pioneerRecordDisplay").style.display = "block";
      const nameShow = getDisplayName(selectedPioneer);
      document.getElementById("pioneerNameHeader").innerText = `${nameShow}`;

      // ⭐️ 2026년부터 현재 봉사연도+1년까지 드롭다운 옵션 자동 생성
      const curSY = getCurrentServiceYear();
      const yrFilter = document.getElementById("pioneerYearFilter");
      yrFilter.innerHTML = "";

      for (let sy = 2026; sy <= curSY + 1; sy++) {
        const opt = document.createElement("option");
        opt.value = sy;
        opt.text = i18n[currentLang].pioneerYearOpt ? i18n[currentLang].pioneerYearOpt(sy) : `${sy} 봉사연도`;
        if (sy === curSY) opt.selected = true;
        yrFilter.appendChild(opt);
      }

      renderPioneerRecordTable();

      if (res.canEditMonth) {
        document.getElementById("pioneerEditAlert").style.display = "flex";
        document.getElementById("pioneerEditText").innerText = `${res.canEditMonth} 보고를 수정할 수 있습니다.`;
      } else {
        document.getElementById("pioneerEditAlert").style.display = "none";
      }
    } else {
      alert(res ? res.message : "조회 실패");
    }
  }

  function renderPioneerRecordTable() {
    if (!pioneerAllRecords) return;
    const yr = Number(document.getElementById("pioneerYearFilter").value) || getCurrentServiceYear();
    const startYr = yr - 1;

    const months = [
      `${startYr}-09`, `${startYr}-10`, `${startYr}-11`, `${startYr}-12`,
      `${yr}-01`, `${yr}-02`, `${yr}-03`, `${yr}-04`,
      `${yr}-05`, `${yr}-06`, `${yr}-07`, `${yr}-08`
    ];

    const tb = document.getElementById("pioneerRecordTable");
    tb.innerHTML = "";

    let sumHours = 0;
    let sumCredit = 0;
    let sumStudies = 0;

    months.forEach(m => {
      const r = pioneerAllRecords[m] || { participated: "-", hours: 0, credit: 0, studies: 0, remarks: "" };
      const tr = document.createElement("tr");
      
      const isPart = r.participated === "예";
      if (isPart) {
        sumHours += Number(r.hours) || 0;
        sumCredit += Number(r.credit) || 0;
        sumStudies += Number(r.studies) || 0;
      }

      tr.innerHTML = `
        <td><strong>${m}</strong></td>
        <td>${r.participated}</td>
        <td>${r.hours || 0}</td>
        <td>${r.credit || 0}</td>
        <td>${r.studies || 0}</td>
      `;
      tb.appendChild(tr);
    });

    const tfoot = document.getElementById("pioneerRecordTotalFoot");
    if (tfoot) {
      tfoot.innerHTML = `
        <tr class="table-primary fs-6">
          <td colspan="2"><strong>연간 합계 (총 ${sumHours + sumCredit}시간)</strong></td>
          <td><strong>${sumHours}</strong></td>
          <td><strong>${sumCredit}</strong></td>
          <td><strong>${sumStudies}</strong></td>
        </tr>
      `;
    }
  }

  function resetPioneerView() {
    document.getElementById("pioneerRecordDisplay").style.display = "none";
    document.getElementById("pioneerAuthBox").style.display = "block";
    document.getElementById("pioneerPin").value = "";
    document.getElementById("pioneerNameSearch").value = "";
    filterPioneers();
  }

  async function openPioneerEditModal() {
    switchMainTab('report');
    document.getElementById("publisherSelect").value = selectedPioneer.id;
    await onPublisherSelectChanged();
  }

  async function submitChangePin() {
    const cur = document.getElementById("curPin").value.trim();
    const n1 = document.getElementById("newPin").value.trim();
    const n2 = document.getElementById("confirmPin").value.trim();

    if (!cur) { alert("현재 비밀번호를 입력하세요."); return; }
    if (!n1 || n1.length < 4 || n1.length > 6) { alert("새 비밀번호는 4자리에서 6자리 사이여야 합니다."); return; }
    if (n1 !== n2) { alert("새 비밀번호 확인이 일치하지 않습니다."); return; }

    const btn = document.getElementById("btnChangePin");
    btn.disabled = true;
    btn.innerText = "변경 처리 중...";

    const res = await apiCall("changePublisherPin", { pubId: selectedPioneer.id, currentPin: cur, newPin: n1 });
    btn.disabled = false;
    btn.innerText = i18n[currentLang].pinSubmit;

    alert(res.message);
    if (res.success) {
      localStorage.setItem("saved_pin_" + selectedPioneer.id, n1);
      document.getElementById("curPin").value = "";
      document.getElementById("newPin").value = "";
      document.getElementById("confirmPin").value = "";
    }
  }
</script>
